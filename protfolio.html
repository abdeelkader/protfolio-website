<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141414;
    --ink:#f5f4f0;
    --muted:#9a9a94;
    --accent:#b9a7ff;
    --rule:#2a2a2a;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink); }
  body{
    font-family:'Space Grotesk', sans-serif;
    min-height:100%;
    overflow-x:hidden;
  }
  a{ color:inherit; text-decoration:none; }

  .wrap{
    max-width:1400px;
    margin:0 auto;
    padding:0 40px;
  }

  header{
    padding-top: calc(28px + env(safe-area-inset-top, 0px));
    padding-bottom:28px;
  }
  .nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
    flex-wrap:wrap;
  }

  .nav img{
    width: 40px;
    height: 40px;
  }
  .mark{
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    border-radius:50%;
    font-weight:700;
    font-size:15px;
    flex:none;
  }
  .navlinks{
    display:flex;
    gap:36px;
    font-size:14px;
    letter-spacing:.02em;
    color:var(--ink);
  }
  .navlinks a{ opacity:.85; transition:opacity .15s ease; }
  .navlinks a:hover{ opacity:1; }

  .cta{
    border:1.5px solid var(--ink);
    padding:10px 20px;
    border-radius:100px;
    font-size:13px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:background .15s ease, color .15s ease;
    flex:none;
  }
  .cta:hover{ background:var(--ink); color:var(--bg); }

  .infobar{
    display:flex;
    justify-content:flex-end;
    gap:64px;
    margin-top:26px;
    flex-wrap:wrap;
  }
  .infobar .col{ text-align:left; }
  .infobar .label{
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 8px;
  }
  .infobar .line{
    font-size:13px;
    line-height:1.6;
    color:var(--ink);
    margin:0;
  }

  main{
    position:relative;
    padding-top:44px;
    padding-bottom:64px;
  }

  .headline{
    font-family:'Archivo Black', sans-serif;
    font-weight:400;
    text-transform:uppercase;
    line-height:0.86;
    letter-spacing:-0.01em;
    font-size:clamp(56px, 11vw, 148px);
    margin:0;
    max-width:70%;
  }

  /* ===== BOX (lklma li f lbox byda) ===== */
  .headline .box{
    display:inline-block;
    color:#141414;
    background-color:white;
    position:relative;
    top:-10px;
    overflow:hidden;          /* bach l7rof mayban-ch mn berra mli kaytle3o/kayhbto */
    padding:.05em .05em .03em;
    vertical-align:top;
    /* 1) wipe: lbox kaytle3 mn liser l limen */
    animation: wipe .9s cubic-bezier(.77,0,.18,1) both;
  }
  @keyframes wipe{
    from{ clip-path: inset(0 100% 0 0); }
    to  { clip-path: inset(0 0 0 0); }
  }

  /* ===== l7rof ===== */
  .word{ display:inline-block; }
  .word .ch{
    display:inline-block;
    transform:translateY(110%);
    opacity:0;
    /* 2) kol 7arf kayttle3 mn lte7t (delay kaytzad mn JS) */
    animation: charIn .6s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes charIn{
    from{ transform:translateY(110%); opacity:0; }
    to  { transform:translateY(0);    opacity:1; }
  }
  /* mli kaykhrjo l7rof (mn lfo9) */
  .word.leaving .ch{
    transform:translateY(0);
    opacity:1;
    animation: charOut .4s cubic-bezier(.6,0,.8,.4) forwards;
  }
  @keyframes charOut{
    from{ transform:translateY(0);     opacity:1; }
    to  { transform:translateY(-110%); opacity:0; }
  }

  .figure{
    position:absolute;
    right:0px;
    bottom:-40px;
    width:clamp(360px, 46vw, 690px);
    pointer-events:none;
    user-select:none;
    z-index:2;
  }
  .figure img{
    display:block;
    width:100%;
    height:auto;
    filter:drop-shadow(0 30px 60px rgba(0,0,0,.45));
  }

  .subline{
    margin-top:36px;
    padding-top:28px;
    border-top:1px solid var(--rule);
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:24px;
    flex-wrap:wrap;
  }
  .subline p{
    margin:0;
    font-size:13px;
    letter-spacing:.03em;
    color:var(--muted);
    max-width:520px;
    text-transform:uppercase;
  }
  .subline .view{
    font-size:13px;
    letter-spacing:.03em;
    color:var(--ink);
    white-space:nowrap;
    border-bottom:1px solid var(--ink);
    padding-bottom:2px;
    flex:none;
  }

  @media (max-width:760px){
    .wrap{ padding:0 22px; }
    .navlinks{ gap:20px; font-size:13px; }
    .infobar{ justify-content:flex-start; gap:40px; }
    .headline{ max-width:100%; font-size:clamp(44px, 15vw, 90px); }
    .figure{ position:static; width:85%; margin:28px auto 0; }
    main{ padding-bottom:36px; }
    .subline p{ max-width:100%; }
  }

  @media (prefers-reduced-motion:no-preference){
    .navlinks a, .cta, .subline .view{ transition-duration:.15s; }
  }

  /* ila l user madayr-ch animations */
  @media (prefers-reduced-motion:reduce){
    .headline .box{ animation:none; }
    .word .ch{ animation:none; transform:none; opacity:1; }
  }
</style>
</head>

<script>
  // Lklmat li ghadi tbdel binathom (BUILD lwl)
  const words   = ["BUILD", "DESIGN", "CREATE", "CODE", "VAN1IKKA"];
  const STAGGER = 0.06;     // delay bin kol 7arf w 7arf (tsnya)
  const HOLD    = 2600;     // ch7al tb9a lklma ban (ms)
  const OUT_MS  = 450;      // modat khourouj l7rof (ms)

  const el = document.getElementById("word");
  let i = 0;

  // kat9asm lklma l 7rof w kat3ti l kol 7arf delay dyalo
  function render(text){
    el.classList.remove("leaving");
    el.innerHTML = [...text]
      .map((c, idx) => `<span class="ch" style="animation-delay:${(idx * STAGGER).toFixed(2)}s">${c}</span>`)
      .join("");
  }

  function next(){
    el.classList.add("leaving");                 // l7rof kaykhrjo lfo9
    setTimeout(() => {
      i = (i + 1) % words.length;
      render(words[i]);                          // l7rof jdad kaydkhlo mn lte7t
    }, OUT_MS + (words[i].length * 30));
  }

  // lbdaya: nstnaw lbox ykml wipe (0.5s) mn be3d l7rof kaytle3o
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduce){
    render(words[0]);
    setInterval(next, HOLD + 1000);
  } else {
    el.textContent = words[0];
  }
